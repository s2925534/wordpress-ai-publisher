# Generic, self-contained example -- works standalone with no registry or
# host dependency: `docker compose -f infra/web/docker-compose.web.yml up
# -d --build`. Copy this file (e.g. to docker-compose.local.yml, gitignored)
# and customize image/container_name/ports/labels for your own environment
# instead of editing this one -- see docs/DEPLOYMENT.md.
services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    # No `image:` pointing at a specific registry/account by default --
    # `build:` above is enough for local/self-hosted use. If you publish to
    # a registry (see .github/workflows/docker-publish.yml, which already
    # publishes to ghcr.io/<your-github-repo> automatically on push), add
    # your own fully-qualified reference here, e.g.:
    #   image: ghcr.io/your-org/wordpress-ai-publisher:latest
    container_name: wordpress-ai-publisher
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      # SQLite database -- must survive image updates/container recreation,
      # which is why it lives on a named volume instead of inside the image.
      - wordpress_ai_publisher_data:/app/data
    labels:
      # Optional: if you run an auto-update watcher on your host (e.g.
      # Watchtower) that polls by label rather than managing this project
      # directly, this is a harmless no-op label to opt in. Remove it if
      # you don't use one.
      - com.centurylinklabs.watchtower.enable=true

volumes:
  wordpress_ai_publisher_data:
